version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: fvm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  app:
    build: .
    container_name: fvm-app
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=file_version_management
      - EXTERNAL_API_BASE_URL=http://localhost:8001/api/v1/external
      - MAX_FILE_SIZE_MB=10
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
